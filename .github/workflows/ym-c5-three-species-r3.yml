name: YM C5 R3 three-species probe

on:
  push:
    branches:
      - ym-c5-three-species-r3-fix
  workflow_dispatch:

jobs:
  three-species-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout harness
      - uses: actions/checkout@v4
        name: Checkout pinned upstream
        with:
          repository: lluiseriksson/THE-ERIKSSON-PROGRAMME
          ref: 8af5e2600c84ec20257f6bbee9b286c0c9527c01
          path: upstream
      - name: Verify pins
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8af5e2600c84ec20257f6bbee9b286c0c9527c01"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.29.0-rc6"
          grep -q "07642720480157414db592fa85b626dafb71355b" upstream/lake-manifest.json
      - name: Install elan
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize dependencies
        shell: bash
        working-directory: upstream
        run: |
          set -euxo pipefail
          before="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          lake update
          after="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          test "$before" = "$after"
          lake exe cache get
      - name: Restore exact C5 parent build cache
        uses: actions/cache@v4
        with:
          path: upstream/.lake/build
          key: ym-c5-three-species-${{ runner.os }}-8af5e2600c84ec20257f6bbee9b286c0c9527c01-v1
      - name: Compile R3 three-species probe
        shell: bash
        run: |
          set -euxo pipefail
          cp probes/C5ThreeSpeciesR3.lean upstream/tmp/C5ThreeSpeciesR3.lean
          cd upstream
          lake env lean tmp/C5ThreeSpeciesR3.lean
