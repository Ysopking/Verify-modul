name: YM RI-LAP strict-mask reconstruction

on:
  push:
    branches:
      - ym-ri-lap-reconstruct
  workflow_dispatch:

jobs:
  ri-lap-strict-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4

      - name: Checkout pinned Eriksson source
        uses: actions/checkout@v4
        with:
          repository: lluiseriksson/THE-ERIKSSON-PROGRAMME
          ref: 8af5e2600c84ec20257f6bbee9b286c0c9527c01
          path: upstream

      - name: Verify pins
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8af5e2600c84ec20257f6bbee9b286c0c9527c01"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.29.0-rc6"
          grep -q "07642720480157414db592fa85b626dafb71355b" upstream/lake-manifest.json

      - name: Install elan
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Materialize pinned dependencies
        shell: bash
        working-directory: upstream
        run: |
          set -euxo pipefail
          before="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          lake update
          after="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          test "$before" = "$after"
          lake exe cache get

      - name: Cache upstream project build
        uses: actions/cache@v4
        with:
          path: upstream/.lake/build
          key: ym-ri-lap-${{ runner.os }}-8af5e2600c84ec20257f6bbee9b286c0c9527c01-v1

      - name: Build strict-mask dependency
        shell: bash
        working-directory: upstream
        run: |
          set -euxo pipefail
          lake build YangMills.RG.NeumannRectangleDirectionalMasks
          lake build YangMills.RG.NeumannPhysicalImageSeam

      - name: Compile reconstructed strict-mask wrapper
        shell: bash
        working-directory: upstream
        run: |
          set -euxo pipefail
          cp "$GITHUB_WORKSPACE/RILapStrictMasks.lean" YangMills/RG/RILapStrictMasks.lean
          lake env lean YangMills/RG/RILapStrictMasks.lean
          lake build YangMills.RG.RILapStrictMasks
          cp "$GITHUB_WORKSPACE/RILapBoundaryReal.lean" YangMills/RG/RILapBoundaryReal.lean
          lake env lean YangMills/RG/RILapBoundaryReal.lean
          cp "$GITHUB_WORKSPACE/RILapHalfOpenFinite.lean" YangMills/RG/RILapHalfOpenFinite.lean
          lake env lean YangMills/RG/RILapHalfOpenFinite.lean
          cp "$GITHUB_WORKSPACE/RILapGhostFullStencil.lean" YangMills/RG/RILapGhostFullStencil.lean
          lake env lean YangMills/RG/RILapGhostFullStencil.lean
